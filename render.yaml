services:
  - type: web
    name: email-saas-platform
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: auto
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_OAUTH_STATE_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_ORGANIZATION_ID
        value: 00000000-0000-0000-0000-000000000001
